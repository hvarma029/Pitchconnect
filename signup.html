<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Proper rendering on all screen sizes -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - PitchConnect</title>
  <link rel="stylesheet" href="style.css">
  <!-- Link to Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="signup-page">
  <div class="signup-container">
    <div class="signup-sidebar">
      <div class="logo">
        <h1>PitchConnect</h1>
      </div>
    </div>
    <div class="signup-content">
      <a href="index.html" class="close-btn" aria-label="Close">
        <i class="fas fa-times"></i>
      </a>
      <h2>Create an Account</h2>
      <div class="account-type-selector">
        <button class="account-type active" data-type="founder">Founder</button>
        <button class="account-type" data-type="investor">Investor</button>
      </div>
      <form id="signup-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
        <p class="text-center">Already have an account? <a href="#">Sign In</a></p>
        <div class="divider">
          <span>or</span>
        </div>
        <button type="button" class="btn btn-social btn-block">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google logo" width="18" height="18">
          Login with Google
        </button>
        <button type="button" class="btn btn-social btn-block">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="LinkedIn logo" width="18" height="18">
          Login with LinkedIn
        </button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
